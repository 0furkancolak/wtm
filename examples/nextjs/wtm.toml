version = 1

[workspace]
name = "nextjs"

[ports]
range = "3000-3999"

[ports.web]
preferred = 3000

[tasks.dev]
description = "Run the Next.js dev server for this worktree."
expose = true
run = ["next", "dev"]
cwd = "{worktree.root}"
background = true

[tasks.test]
description = "Run the project's test suite."
run = ["npm", "test"]
cwd = "{worktree.root}"
