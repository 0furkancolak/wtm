name: Performance
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release-budgets:
    name: Budgets ${{ matrix.arch }}
    timeout-minutes: 30
    # Budgets are measured per architecture, because they differ per architecture: idle RSS sits
    # near its blocker on x64 while arm64 has room. The release does not gate on these numbers, so
    # this is the only place they are taken — it has to cover what the release ships.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # Numbers taken to be compared across architectures have to come from one runtime. This
          # asked for whatever Node 24 was latest and measured arm64 on 24.18.0 against x64 on
          # 24.19.0.
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun run test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wtm-performance-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/performance.json
          if-no-files-found: error
