name: Release
on:
  push:
    tags:
      - 'v*'

# Publication is opt-in per job. Nothing here runs for ordinary pushes or pull requests.
permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.platform }} ${{ matrix.arch }}
    # A verify takes about eight minutes. Twice a hung scenario child held one past forty,
    # because `spawnSync` blocks and no per-test timeout can interrupt a blocking call. The
    # children have their own bound now; this one makes a hang anywhere else end visibly.
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      # One architecture failing must not cancel the other. A release publishes both, so a run
      # that stops at the first failure reports half of what is wrong and costs another tag to
      # learn the rest.
      fail-fast: false
      matrix:
        include:
          # Each executable is built natively; the SEA embeds a host-architecture Node runtime.
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: darwin
            arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile

      - name: Verify the whole release
        run: bun run release:verify

      - name: Measure performance budgets
        run: |
          set -uo pipefail
          # The gate, not this step, decides what a performance blocker means for a release: a
          # prerelease may still publish through one, a stable release may not
          # (verify-release.ts's verifyPerformance, todo item 4). test:perf's own exit code would
          # end this job before the gate ever saw the number, so it is deliberately not trusted.
          bun run test:perf || true

      - name: Sign the executable
        id: sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE}" ] || [ -z "${SIGNING_IDENTITY}" ]; then
            # The gate refuses a stable release in this state; prereleases stay ad-hoc signed.
            echo 'signing=adhoc' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/wtm-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          codesign --sign "$SIGNING_IDENTITY" --options runtime --timestamp --force dist/sea/wtm
          codesign --verify --strict dist/sea/wtm
          echo 'signing=signed' >> "$GITHUB_OUTPUT"

      - name: Re-verify the signed executable
        run: |
          set -uo pipefail
          if bun test scripts/__tests__/sea-smoke.test.ts --timeout 60000; then
            smoke='[{"name":"standalone executable smoke suite","passed":true}]'
          else
            smoke='[{"name":"standalone executable smoke suite","passed":false,'
            smoke="$smoke"'"detail":"scripts/__tests__/sea-smoke.test.ts failed after signing"}]'
          fi
          # The gate, not this step, decides what a failed smoke result means for a release.
          echo "WTM_RELEASE_SMOKE=$smoke" >> "$GITHUB_ENV"

      - name: Notarize the executable
        id: notarize
        env:
          NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          SIGNING: ${{ steps.sign.outputs.signing }}
        run: |
          set -euo pipefail
          # Same rule as signing: an absent credential is a skip, not a failure, so a contributor
          # with no Apple account can still build a prerelease. The gate refuses a *stable*
          # release in this state. An ad-hoc signature is skipped too -- the notary service only
          # accepts Developer ID signed code, so submitting one would fail a build that did
          # nothing wrong.
          if [ "${SIGNING}" != 'signed' ] || [ -z "${NOTARIZATION_APPLE_ID}" ] \
            || [ -z "${NOTARIZATION_PASSWORD}" ] || [ -z "${NOTARIZATION_TEAM_ID}" ]; then
            echo 'notarization=skipped' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The notary service accepts UDIF disk images, signed flat installer packages and ZIP
          # archives -- not a bare Mach-O. So the executable is zipped for the submission only.
          # This zip is never published: the release still ships the .tar.gz built below, and the
          # ticket is keyed to the code directory hash rather than to the container, so the
          # binary inside that tarball is the notarized one.
          submission="$RUNNER_TEMP/wtm-notarization.zip"
          /usr/bin/ditto -c -k dist/sea/wtm "$submission"
          # `--wait` returns only once the service has finished, so no polling is needed. The
          # status is then read rather than inferred: a submission can come back Invalid, and a
          # release must not turn on whether that is reported through the exit code.
          xcrun notarytool submit "$submission" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --output-format json \
            --wait > "$RUNNER_TEMP/notarization.json"
          rm -f "$submission"
          status="$(bun -e "const {readFileSync}=require('node:fs');
            const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/notarization.json','utf8'));
            process.stdout.write(String(r.status ?? ''));")"
          if [ "$status" != 'Accepted' ]; then
            echo "The notary service answered \"$status\", not \"Accepted\"." >&2
            id="$(bun -e "const {readFileSync}=require('node:fs');
              const r=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/notarization.json','utf8'));
              process.stdout.write(String(r.id ?? ''));")"
            # Apple's own advice is to always read the log, even on success. On a refusal it is
            # the only place the actual reason appears.
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --apple-id "$NOTARIZATION_APPLE_ID" \
                --password "$NOTARIZATION_PASSWORD" \
                --team-id "$NOTARIZATION_TEAM_ID" >&2 || true
            fi
            exit 1
          fi
          echo 'notarization=notarized' >> "$GITHUB_OUTPUT"

      - name: Verify Gatekeeper accepts the executable
        env:
          NOTARIZATION: ${{ steps.notarize.outputs.notarization }}
        run: |
          set -euo pipefail
          if [ "${NOTARIZATION}" != 'notarized' ]; then
            echo 'Notarization was skipped, so there is no ticket for Gatekeeper to look up.'
            exit 0
          fi
          # Apple cannot staple a ticket to a standalone binary, so this is an online lookup
          # against the notary service -- which is exactly what a user's first run performs. It
          # is the closest thing CI has to "a clean machine accepts it": this runner has never
          # seen this binary before. `spctl` exits non-zero when it rejects, so `set -e` is the
          # failure.
          spctl --assess --type execute --verbose=2 dist/sea/wtm

      - name: Archive the signed executable
        run: |
          set -euo pipefail
          bun run release:artifacts
          # Archiving rebuilds the directory, so the evidence is recorded afterwards and travels
          # with the artifact instead of being re-asserted by the publishing job.
          echo '${{ steps.sign.outputs.signing }}' > dist/release/SIGNING
          echo '${{ steps.notarize.outputs.notarization }}' > dist/release/NOTARIZATION
          printf '%s' "$WTM_RELEASE_SMOKE" > dist/release/SMOKE.json
          # Wrapped as a one-element array up front: verifyPerformance sums blockers/warnings
          # across every architecture's report, and the combined gate in `publish` below simply
          # concatenates this file with the other architecture's, the same way it already does
          # for SHA256SUMS.
          bun -e "const {readFileSync,writeFileSync}=require('node:fs');
            const r=JSON.parse(readFileSync('artifacts/performance.json','utf8')).release;
            writeFileSync('dist/release/PERFORMANCE.json', JSON.stringify([r]));"
          {
            echo 'WTM_RELEASE_PERFORMANCE<<WTM_PERFORMANCE_EOF'
            cat dist/release/PERFORMANCE.json
            echo
            echo 'WTM_PERFORMANCE_EOF'
          } >> "$GITHUB_ENV"

      - name: Gate the release artifacts
        env:
          WTM_RELEASE_SIGNING: ${{ steps.sign.outputs.signing }}
          WTM_RELEASE_NOTARIZATION: ${{ steps.notarize.outputs.notarization }}
          # This leg built one target, so it gates one archive. The whole release is gated again by
          # the job that collects every leg. Platform *and* architecture, because two published
          # targets share each architecture: an arch alone no longer names an archive.
          WTM_RELEASE_PLATFORM: ${{ matrix.platform }}
          WTM_RELEASE_ARCH: ${{ matrix.arch }}
        run: bun run release:gate

      - uses: actions/upload-artifact@v4
        with:
          name: wtm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  # Linux archives are published assets, not only something `bun run release:artifacts` can build
  # on a contributor's own machine (todo item 29). A separate job rather than two more legs of the
  # matrix above: signing, notarization and Gatekeeper are three steps that would each need a
  # `matrix.platform == 'darwin'` guard, and the evidence they produce would have to be read
  # through a conditional expression whose falsy branch silently reads as "not applicable" -- on
  # the one job where getting that wrong publishes an unsigned macOS binary.
  verify-linux:
    name: Verify ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built natively for the same reason the macOS legs are: the SEA embeds a
          # host-architecture Node runtime, and the archive step checks the ELF header against the
          # architecture it claims to be.
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile

      # The same whole-release gate the macOS legs run, ending in `release:artifacts`, which writes
      # this architecture's tarball and its own one-line SHA256SUMS.
      - name: Verify the whole release
        run: bun run release:verify

      - name: Measure performance budgets
        run: |
          set -uo pipefail
          # The gate decides what a blocker means for a release, exactly as on macOS: test:perf's
          # own exit code would end this job before the gate ever saw the number. The budgets
          # themselves are not an Apple matter -- `scripts/performance-report.ts` records the host
          # platform alongside the counters and applies the same thresholds everywhere.
          bun run test:perf || true

      - name: Verify the executable
        run: |
          set -uo pipefail
          # `release:verify` already ran this suite, but as an exit code that ended the step. The
          # gate refuses a release with no smoke evidence, and evidence is a verdict it can read.
          if bun test scripts/__tests__/sea-smoke.test.ts --timeout 60000; then
            smoke='[{"name":"standalone executable smoke suite","passed":true}]'
          else
            smoke='[{"name":"standalone executable smoke suite","passed":false,'
            smoke="$smoke"'"detail":"scripts/__tests__/sea-smoke.test.ts failed"}]'
          fi
          # The gate, not this step, decides what a failed smoke result means for a release.
          echo "WTM_RELEASE_SMOKE=$smoke" >> "$GITHUB_ENV"

      - name: Record the release evidence
        run: |
          set -euo pipefail
          # Nothing signs or notarizes an ELF executable here, and there is no Gatekeeper to clear:
          # `not-applicable` is that stated outright, which is the only answer the gate accepts for
          # a selection with no macOS archive in it. Writing an Apple status here -- or leaving the
          # file empty -- is refused rather than quietly believed.
          echo 'not-applicable' > dist/release/SIGNING
          echo 'not-applicable' > dist/release/NOTARIZATION
          printf '%s' "$WTM_RELEASE_SMOKE" > dist/release/SMOKE.json
          # One element per leg, concatenated by the combined gate the same way SHA256SUMS is.
          bun -e "const {readFileSync,writeFileSync}=require('node:fs');
            const r=JSON.parse(readFileSync('artifacts/performance.json','utf8')).release;
            writeFileSync('dist/release/PERFORMANCE.json', JSON.stringify([r]));"
          {
            echo 'WTM_RELEASE_PERFORMANCE<<WTM_PERFORMANCE_EOF'
            cat dist/release/PERFORMANCE.json
            echo
            echo 'WTM_PERFORMANCE_EOF'
          } >> "$GITHUB_ENV"

      - name: Gate the release artifacts
        env:
          WTM_RELEASE_SIGNING: not-applicable
          WTM_RELEASE_NOTARIZATION: not-applicable
          WTM_RELEASE_PLATFORM: ${{ matrix.platform }}
          WTM_RELEASE_ARCH: ${{ matrix.arch }}
        run: bun run release:gate

      - uses: actions/upload-artifact@v4
        with:
          name: wtm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  # W6-1 / todo item 29b: the Windows half of the Linux job above. Same reasoning for a separate
  # job (signing/notarization/Gatekeeper name a Mach-O executable and would need a
  # `matrix.platform == 'win32'` guard on every one of those steps instead), plus one more: the
  # whole-release gate for one `bun run test` step ci.yml's win32 leg already measured and
  # documented (`validate` job above) -- a real per-call PowerShell cost in
  # `ManagedLogStore`'s rotation tests, not a hang, that a flat 60s bound fails outright. This job
  # cannot reuse the `release:verify` composite script for that reason: it runs the same steps in
  # the same order, but with the wider bound and whole-run budget ci.yml's own win32 leg already
  # established as necessary, not a new guess.
  verify-windows:
    name: Verify ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            arch: x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      # Same install flake and the same fix ci.yml's win32 leg documents in full: better-sqlite3
      # has no Windows prebuild for this bun/Node ABI, so its install shells out to a nested
      # `bun x node-gyp rebuild` that can race the outer install's own cache writes.
      - name: bun install --frozen-lockfile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              bun run verify:install && exit 0
              bun pm cache rm || true
            fi
            echo "bun install failed or left an unloadable tree (attempt $attempt/3), retrying..." >&2
            rm -rf node_modules || true
            sleep 5
          done
          exit 1

      # `release:verify`'s own steps, in its own order, with only the `test` bound widened.
      - run: bun run lint
        shell: bash
      - run: bun run typecheck
        shell: bash
      - run: bun run build
        shell: bash
      - run: bun run binary:verify
        shell: bash
      - run: bun run test --timeout 300000 --budget 1200000
        shell: bash
      - run: bun run test:e2e
        shell: bash
      - run: bun install --frozen-lockfile
        shell: bash
      - run: bun run package:verify
        shell: bash
      - run: bun run release:artifacts
        shell: bash

      - name: Measure performance budgets
        shell: bash
        run: |
          set -uo pipefail
          bun run test:perf || true

      - name: Verify the executable
        shell: bash
        run: |
          set -uo pipefail
          if bun test scripts/__tests__/sea-smoke.test.ts --timeout 60000; then
            smoke='[{"name":"standalone executable smoke suite","passed":true}]'
          else
            smoke='[{"name":"standalone executable smoke suite","passed":false,'
            smoke="$smoke"'"detail":"scripts/__tests__/sea-smoke.test.ts failed"}]'
          fi
          echo "WTM_RELEASE_SMOKE=$smoke" >> "$GITHUB_ENV"

      - name: Record the release evidence
        shell: bash
        run: |
          set -euo pipefail
          # Nothing signs a PE executable here and there is no Gatekeeper equivalent to clear:
          # not-applicable is the same explicit answer the Linux leg gives, for the same reason.
          echo 'not-applicable' > dist/release/SIGNING
          echo 'not-applicable' > dist/release/NOTARIZATION
          printf '%s' "$WTM_RELEASE_SMOKE" > dist/release/SMOKE.json
          bun -e "const {readFileSync,writeFileSync}=require('node:fs');
            const r=JSON.parse(readFileSync('artifacts/performance.json','utf8')).release;
            writeFileSync('dist/release/PERFORMANCE.json', JSON.stringify([r]));"
          {
            echo 'WTM_RELEASE_PERFORMANCE<<WTM_PERFORMANCE_EOF'
            cat dist/release/PERFORMANCE.json
            echo
            echo 'WTM_PERFORMANCE_EOF'
          } >> "$GITHUB_ENV"

      - name: Gate the release artifacts
        shell: bash
        env:
          WTM_RELEASE_SIGNING: not-applicable
          WTM_RELEASE_NOTARIZATION: not-applicable
          WTM_RELEASE_PLATFORM: ${{ matrix.platform }}
          WTM_RELEASE_ARCH: ${{ matrix.arch }}
        run: bun run release:gate

      - uses: actions/upload-artifact@v4
        with:
          name: wtm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    timeout-minutes: 20
    needs: [verify, verify-linux, verify-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile

      # Every verify leg uploads as `wtm-<platform>-<arch>`, and they are the only artifacts this
      # workflow uploads before this job runs -- `homebrew-formula` comes from `formula`, which
      # needs `publish` and so cannot exist yet.
      - uses: actions/download-artifact@v4
        with:
          pattern: wtm-*
          path: staged/

      - name: Collect every architecture
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist/release
          find staged \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/release/ ';'
          # Each leg wrote its own one-line SHA256SUMS; the release carries the union of all of them.
          cat staged/*/SHA256SUMS | sort -k2 > dist/release/SHA256SUMS
          # Signing and notarization describe macOS archives, so they are read from the macOS legs
          # alone. Those two must agree, or the release does not describe one build.
          signing="$(cat staged/wtm-darwin-*/SIGNING | sort -u)"
          test "$(printf '%s\n' "$signing" | wc -l | tr -d ' ')" -eq 1
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          # Notarization is one value across both macOS architectures for the same reason signing
          # is: a release where one architecture is notarized and the other is not does not describe
          # one build, and the gate would otherwise be handed whichever value sorted first.
          notarization="$(cat staged/wtm-darwin-*/NOTARIZATION | sort -u)"
          test "$(printf '%s\n' "$notarization" | wc -l | tr -d ' ')" -eq 1
          echo "notarization=$notarization" >> "$GITHUB_OUTPUT"
          # A Linux leg claiming an Apple status signed nothing: the evidence would have reached
          # this job from some other build. The gate refuses that too, but it never sees these
          # files -- it is handed the macOS values above -- so the claim is refused here.
          test "$(cat staged/wtm-linux-*/SIGNING staged/wtm-linux-*/NOTARIZATION | sort -u)" = 'not-applicable'
          # Same claim, same reason, for the Windows leg's PE executable.
          test "$(cat staged/wtm-win32-*/SIGNING staged/wtm-win32-*/NOTARIZATION | sort -u)" = 'not-applicable'
          # The name the gate reads. Exporting it as anything else leaves the gate with no smoke
          # evidence at all, which it refuses.
          {
            echo 'WTM_RELEASE_SMOKE<<WTM_SMOKE_EOF'
            bun -e 'const {readdirSync,readFileSync}=require("node:fs");
              const roots=readdirSync("staged");
              const merged=roots.flatMap((dir)=>JSON.parse(readFileSync(`staged/${dir}/SMOKE.json`,"utf8"))
                .map((check)=>({...check,name:`${dir}: ${check.name}`})));
              process.stdout.write(JSON.stringify(merged));'
            echo
            echo 'WTM_SMOKE_EOF'
          } >> "$GITHUB_ENV"
          # Same idea as smoke above: each architecture's own single-element performance report,
          # concatenated into the array the combined gate sums blockers and warnings across.
          {
            echo 'WTM_RELEASE_PERFORMANCE<<WTM_PERFORMANCE_EOF'
            bun -e 'const {readdirSync,readFileSync}=require("node:fs");
              const roots=readdirSync("staged");
              const merged=roots.flatMap((dir)=>JSON.parse(readFileSync(`staged/${dir}/PERFORMANCE.json`,"utf8")));
              process.stdout.write(JSON.stringify(merged));'
            echo
            echo 'WTM_PERFORMANCE_EOF'
          } >> "$GITHUB_ENV"

      - name: Gate the combined release
        env:
          WTM_RELEASE_SIGNING: ${{ steps.collect.outputs.signing }}
          WTM_RELEASE_NOTARIZATION: ${{ steps.collect.outputs.notarization }}
        run: bun run release:gate

      # Provenance has to describe the build that produced these archives. The generic attest
      # action was handed the SLSA provenance type with an empty predicate, which the attestation
      # API rejects outright: `build definition is nil`. This action derives the real one from the
      # workflow that is running.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=''
          case "${{ github.ref_name }}" in *-*) prerelease='--prerelease';; esac
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file CHANGELOG.md \
            --verify-tag $prerelease \
            dist/release/wtm-darwin-arm64.tar.gz \
            dist/release/wtm-darwin-x64.tar.gz \
            dist/release/wtm-linux-x64.tar.gz \
            dist/release/wtm-linux-arm64.tar.gz \
            dist/release/wtm-windows-x64.zip \
            dist/release/SHA256SUMS

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            # The archives are already published and attested; an unconfigured second channel
            # must not retract them by failing the job.
            echo 'No npm credential configured; the GitHub Release stands without the npm channel.'
            exit 0
          fi
          # A prerelease must never become what `npm install <name>` hands to everyone.
          tag='latest'
          case "${{ github.ref_name }}" in *-*) tag='next';; esac
          # The same reasoning as the absent credential above, applied to one that is present but
          # no longer works. This token expires, and npm can reject it for reasons that have nothing
          # to do with the build: an expired token would otherwise turn a release that is already
          # published and attested into a failed job. The annotation is the record that it happened.
          npm publish --provenance --access public --tag "$tag" \
            || echo "::warning::npm publish failed; ${{ github.ref_name }} stands on the GitHub Release without the npm channel."

  formula:
    name: Homebrew formula
    timeout-minutes: 20
    needs: publish
    # A prerelease must never become the default formula for `brew install`.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          pattern: wtm-darwin-*
          path: staged/

      - name: Render the formula from the published checksums
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cat staged/*/SHA256SUMS | sort -k2 > dist/release/SHA256SUMS
          # Digests come from the artifacts that were just uploaded; they are never guessed.
          bun run formula:render
          ruby -c artifacts/formula/wtm.rb

      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo 'No tap token configured; the rendered formula is left as a build artifact.'
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/0furkancolak/homebrew-wtm.git" tap
          mkdir -p tap/Formula
          cp artifacts/formula/wtm.rb tap/Formula/wtm.rb
          git -C tap add Formula/wtm.rb
          git -C tap -c user.name='wtm-release' -c user.email='release@nafru.com' \
            commit -m "wtm ${{ github.ref_name }}"
          git -C tap push

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: artifacts/formula/wtm.rb
          if-no-files-found: error
