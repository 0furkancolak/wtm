name: CI
# A branch push used to start a second, identical run next to its pull request's run, doubling the
# macOS runner queue for every commit. Branches are validated through their pull request; only
# main is validated on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# A new commit on the same pull request makes the older run's answer obsolete. main keeps every run,
# so each merged commit gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.platform }} ${{ matrix.arch }}
    # win32 is informational until todo item 9 lands. Its leg still runs the full list below, but
    # about 80 tests fail natively today and several of them wait out the 300s per-test bound, so the
    # leg used to hit its 60 minute cap on every run and turn every run red, however the other four
    # legs did. Until those failures are fixed, the leg reports without deciding the run's result,
    # and stops at 25 minutes: long enough to show which tests fail, not long enough to hold up
    # every pull request for an hour.
    #
    # win32 still gets more room per test than the POSIX legs: its file-trust checks shell out to a
    # real powershell.exe per call (`@wtm/platform`'s windows-powershell.ts), and a cold PowerShell
    # 5.1 process genuinely costs on the order of a second to start and import
    # Microsoft.PowerShell.Security -- there is no equivalent per-call cost on POSIX, where the
    # same check is a plain `fs.stat`.
    continue-on-error: ${{ matrix.platform == 'win32' }}
    timeout-minutes: ${{ matrix.platform == 'win32' && 25 || 30 }}
    # The release ships an executable per architecture, and they do not fail together: linking and
    # signing behave differently on x64. Building only on Apple silicon left the other half of the
    # release unproven until a tag tried to publish it.
    #
    # The linux and win32 legs run the same list, in the same order, deliberately. Increments C1
    # and D1/D2 each wrote a whole backend that no kernel of its own had ever executed, and the
    # failure mode of that kind of work is a second (or third) green column that proves less than
    # the first: a leg that skipped the standalone build, or the end-to-end workflow, or the tests
    # that spawn and supervise real processes, would report the same word for a much weaker claim.
    # Where a platform genuinely cannot run something, the spec says so in writing rather than the
    # matrix saying it in silence — the Windows increment's own spec names the standalone
    # executable's missing strip and code signing as exactly that kind of documented gap, not a
    # silently weaker claim.
    #
    # `platform` is in the job name because `arch` alone no longer identifies a leg: x64 now names
    # macos-15-intel, ubuntu, and windows-latest all at once.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: win32
            arch: x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # The standalone build refuses any runtime but the pinned one, and this job builds it.
          node-version: 24.18.0
      # win32 has hit this three times with three different underlying messages (ENOTEMPTY once,
      # ENOENT twice), always at the same spot: better-sqlite3 has no Windows prebuild for this
      # bun/Node ABI, so its install script shells out to a nested `bun x node-gyp rebuild`, and
      # node-gyp's own header download needs bun's package cache to resolve `tar` -- a second bun
      # process racing the outer install's own cache writes. This is a real bug in bun's Windows
      # cache/rename handling under that nested concurrency, not our code or generic CI noise, and
      # not something this repo can fix at its source; `shell: bash` (Git Bash ships on
      # windows-latest) keeps one retry loop working the same on every leg.
      - name: bun install --frozen-lockfile
        shell: bash
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install failed (attempt $attempt/3), retrying..." >&2
            sleep 5
          done
          exit 1
      - run: bun run lint
      - run: bun run typecheck
      # A per-test timeout catches a hang; it is not an assertion about speed. The slowest
      # honest test measures an idle daemon for ~22s, and the Intel runner varies enough that
      # 30s failed work that was doing exactly what it should. win32 gets a much larger bound for
      # the same real-cost reason its job timeout is widened above: `ManagedLogStore`'s rotation
      # tests each make several real `Get-Acl`-backed trust checks, and a real leg measured one of
      # them landing at 149s and another still short of done past 180s, on nothing but that
      # per-call cost stacked across many checks, not a hang. This is a stopgap, not the real fix
      # -- a per-call cost this size means a pooled/long-lived powershell.exe (reusing one already-
      # imported session instead of paying the ~1.6s cold-start module import every call) is the
      # actual answer, tracked as its own follow-up rather than raised indefinitely here.
      - run: bun run test --timeout ${{ matrix.platform == 'win32' && 300000 || 60000 }}
      - run: bun run test:e2e
      - run: bun run build
      - run: bun run package:verify
      # Ordinary CI proves the current host can produce a working executable; it never publishes one.
      - run: bun run binary:verify
      - name: Verify the Linux executable archive
        if: matrix.platform == 'linux'
        run: bun scripts/__tests__/release-artifacts-native.scenario.ts dist/sea/wtm
