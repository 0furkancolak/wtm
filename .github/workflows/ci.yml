name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.platform }} ${{ matrix.arch }}
    timeout-minutes: 30
    # The release ships an executable per architecture, and they do not fail together: linking and
    # signing behave differently on x64. Building only on Apple silicon left the other half of the
    # release unproven until a tag tried to publish it.
    #
    # The linux leg runs the same list, in the same order, deliberately. Increment C1 wrote a whole
    # Linux backend that no kernel had ever executed, and the failure mode of that kind of work is
    # a second green column that proves less than the first: a leg that skipped the standalone
    # build, or the end-to-end workflow, or the tests that spawn and supervise real processes,
    # would report the same word for a much weaker claim. Where linux genuinely cannot run
    # something, the spec says so in writing rather than the matrix saying it in silence.
    #
    # `platform` is in the job name because `arch` alone no longer identifies a leg: x64 now names
    # both macos-15-intel and ubuntu.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # The standalone build refuses any runtime but the pinned one, and this job builds it.
          node-version: 24.18.0
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # A per-test timeout catches a hang; it is not an assertion about speed. The slowest
      # honest test measures an idle daemon for ~22s, and the Intel runner varies enough that
      # 30s failed work that was doing exactly what it should.
      - run: bun run test --timeout 60000
      - run: bun run test:e2e
      - run: bun run build
      - run: bun run package:verify
      # Ordinary CI proves the current host can produce a working executable; it never publishes one.
      - run: bun run binary:verify
