name: CI
# A branch push used to start a second, identical run next to its pull request's run, doubling the
# macOS runner queue for every commit. Branches are validated through their pull request; only
# main is validated on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      win32_test_filter:
        description: >-
          Space-separated list of test file paths/patterns passed to `bun test` on the win32 leg
          only (e.g. "packages/x/src/__tests__/a.test.ts"). Skips the other four legs and the
          win32 leg's full-suite-only steps (e2e/build/package/binary); lint and typecheck still
          run. Leave empty to run the full suite on every leg as usual.
        required: false
        default: ''
        type: string
# A new commit on the same pull request makes the older run's answer obsolete. main keeps every run,
# so each merged commit gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  validate:
    name: Validate ${{ matrix.platform }} ${{ matrix.arch }}
    # win32 is informational until todo item 9 lands. Its leg still runs the full list below, but
    # about 80 tests fail natively today and several of them wait out the 300s per-test bound, so the
    # leg used to hit its 60 minute cap on every run and turn every run red, however the other four
    # legs did. Until those failures are fixed, the leg reports without deciding the run's result,
    # and stops at 25 minutes: long enough to show which tests fail, not long enough to hold up
    # every pull request for an hour.
    #
    # win32 still gets more room per test than the POSIX legs: its file-trust checks shell out to a
    # real powershell.exe per call (`@wtm/platform`'s windows-powershell.ts), and a cold PowerShell
    # 5.1 process genuinely costs on the order of a second to start and import
    # Microsoft.PowerShell.Security -- there is no equivalent per-call cost on POSIX, where the
    # same check is a plain `fs.stat`.
    # `win32_test_filter` (workflow_dispatch only) narrows evidence-gathering to the win32 leg: the
    # other four legs are pure repeats of the same full suite and add nothing when the point of the
    # run is proving a targeted group of Windows test files green within the 25 minute cap.
    #
    # This is done with a job `env:` plus step-level `if:`, not a job-level `if:` -- GitHub Actions
    # only makes `github`, `needs`, `vars` and `inputs` available in `jobs.<job_id>.if`; `matrix` is
    # not in that list (see the context-availability table in GitHub's docs), so an `if:` here that
    # reads `matrix.platform` makes the whole workflow file invalid and breaks CI on every run. `env:`
    # and step-level `if:` both do allow `matrix`, so the four non-win32 legs instead skip every step
    # after checkout (see `CI_WIN32_FILTER_RUN` below) -- their jobs still run and keep their normal
    # `Validate <platform> <arch>` name, just reporting success with those steps shown as skipped.
    # A filter run exists to prove a targeted group of Windows test files green, so its result has
    # to decide the run; `continue-on-error` would report success whatever `bun test` did. The
    # condition is spelled out instead of reusing `env.CI_WIN32_FILTER_RUN` because
    # `jobs.<job_id>.continue-on-error` is evaluated without the `env` context.
    continue-on-error: >-
      ${{ matrix.platform == 'win32'
      && !(github.event_name == 'workflow_dispatch' && inputs.win32_test_filter != '') }}
    timeout-minutes: ${{ matrix.platform == 'win32' && 25 || 30 }}
    # The release ships an executable per architecture, and they do not fail together: linking and
    # signing behave differently on x64. Building only on Apple silicon left the other half of the
    # release unproven until a tag tried to publish it.
    #
    # The linux and win32 legs run the same list, in the same order, deliberately. Increments C1
    # and D1/D2 each wrote a whole backend that no kernel of its own had ever executed, and the
    # failure mode of that kind of work is a second (or third) green column that proves less than
    # the first: a leg that skipped the standalone build, or the end-to-end workflow, or the tests
    # that spawn and supervise real processes, would report the same word for a much weaker claim.
    # Where a platform genuinely cannot run something, the spec says so in writing rather than the
    # matrix saying it in silence — the Windows increment's own spec names the standalone
    # executable's missing strip and code signing as exactly that kind of documented gap, not a
    # silently weaker claim.
    #
    # `platform` is in the job name because `arch` alone no longer identifies a leg: x64 now names
    # macos-15-intel, ubuntu, and windows-latest all at once.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            runner: macos-15
          - platform: darwin
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: win32
            arch: x64
            runner: windows-latest
    # true only for a workflow_dispatch run that set win32_test_filter -- computed once here (from
    # `github`/`inputs`, both always available) so every step below can gate on one short, stable
    # `env.CI_WIN32_FILTER_RUN == 'true'`/`!= 'true'` check instead of repeating the two-context
    # expression. `env:` values are always strings, hence the string comparison.
    env:
      CI_WIN32_FILTER_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.win32_test_filter != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip (win32_test_filter run only exercises the win32 leg)
        if: env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32'
        # Quoted as a whole: a plain YAML scalar may not contain ": ", and the message wants a colon.
        run: 'echo "Skipping this leg: workflow_dispatch requested a win32_test_filter run, which only exercises the win32 leg."'
      - uses: oven-sh/setup-bun@v2
        if: "!(env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32')"
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        if: "!(env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32')"
        with:
          # The standalone build refuses any runtime but the pinned one, and this job builds it.
          node-version: 24.18.0
      # win32 has hit this three times with three different underlying messages (ENOTEMPTY once,
      # ENOENT twice), always at the same spot: better-sqlite3 has no Windows prebuild for this
      # bun/Node ABI, so its install script shells out to a nested `bun x node-gyp rebuild`, and
      # node-gyp's own header download needs bun's package cache to resolve `tar` -- a second bun
      # process racing the outer install's own cache writes. This is a real bug in bun's Windows
      # cache/rename handling under that nested concurrency, not our code or generic CI noise, and
      # not something this repo can fix at its source; `shell: bash` (Git Bash ships on
      # windows-latest) keeps one retry loop working the same on every leg.
      #
      # A non-zero exit is not the only way this step can fail. On 2026-09-18 a win32 install
      # exited 0 in 15s (the baseline is 32-70s) having written `zod` without its `v4/locales/`
      # directory. Nothing retried, because nothing had reported a failure; 154 of 238 test files
      # then aborted at import in under a second each, and the leg published that count as though
      # it were an inventory of Windows failures. `verify:install` loads every external dependency
      # under both bun and node -- the two runtimes the suite uses, which resolve different entry
      # points of the same package -- so the loop retries on a tree that cannot be loaded, not only
      # on an installer that admitted defeat. `node_modules` goes before every retry, because the
      # installer believes that tree is already correct and would otherwise leave it as it is.
      # bun's package cache is cleared only when the install reported success and the tree still
      # would not load, since that is the case where the cache is the suspect; the failed-install
      # case above is a race *against* cache writes, which an empty cache would only lengthen.
      # Both clears tolerate failure: a locked file on Windows is a reason to try the install
      # again, not to end the job.
      - name: bun install --frozen-lockfile
        if: "!(env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32')"
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              bun run verify:install && exit 0
              bun pm cache rm || true
            fi
            echo "bun install failed or left an unloadable tree (attempt $attempt/3), retrying..." >&2
            rm -rf node_modules || true
            sleep 5
          done
          exit 1
      # Placed before lint/typecheck: a filter run is dispatched to get Windows test evidence,
      # often mid-refactor, and a red lint or tsc would otherwise end the job before the one
      # step the run exists for had a chance to report.
      # win32_test_filter never reaches the shell through `${{ inputs. }}` interpolation (that would
      # let a workflow_dispatch caller inject arbitrary shell into a `run:` script); it is passed
      # through `env:` and re-validated here as a second gate against a hand-typed input.
      - name: win32 targeted test filter
        if: env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform == 'win32'
        shell: bash
        env:
          WIN32_TEST_FILTER: ${{ inputs.win32_test_filter }}
        run: |
          # Workflow commands are read from a step's stdout, so the annotation must not go to stderr.
          if [[ ! "$WIN32_TEST_FILTER" =~ ^[A-Za-z0-9_./ *-]+$ ]]; then
            echo "::error::win32_test_filter allows only [A-Za-z0-9_./*-] and spaces"
            exit 1
          fi
          # The character class permits a leading `-`, which would otherwise reach `bun test` as an
          # option (`--preload ...`) rather than a path. `--` ends option parsing; the filter is
          # intentionally left unquoted so spaces split it into separate file arguments.
          bun test --max-concurrency=1 --parallel=1 --timeout 300000 -- $WIN32_TEST_FILTER
      - run: bun run lint
        if: "!(env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32')"
      - run: bun run typecheck
        if: "!(env.CI_WIN32_FILTER_RUN == 'true' && matrix.platform != 'win32')"
      # A per-test timeout catches a hang; it is not an assertion about speed. The slowest
      # honest test measures an idle daemon for ~22s, and the Intel runner varies enough that
      # 30s failed work that was doing exactly what it should. win32 gets a much larger bound for
      # the same real-cost reason its job timeout is widened above: `ManagedLogStore`'s rotation
      # tests each make several real `Get-Acl`-backed trust checks, and a real leg measured one of
      # them landing at 149s and another still short of done past 180s, on nothing but that
      # per-call cost stacked across many checks, not a hang. The real fix -- one pooled,
      # long-lived powershell.exe reused across calls instead of paying the ~1.6s cold-start
      # module import every time -- landed as `packages/platform/src/trust/`
      # `windows-powershell-session.ts` (W2-2 / cluster 9c). The bound stays at this value until a
      # win32 leg measures what those tests now cost: lowering it on the strength of the change
      # alone would trade a stopgap for a guess.
      #
      # win32 also gets a whole-run budget, and it is what keeps this leg informational in fact
      # rather than only in intent. `continue-on-error` above absorbs a job that *failed*; a job
      # that reaches its own `timeout-minutes` is *cancelled*, which it does not absorb. The leg
      # reached the cap on every run, so every CI run on this repository reported `cancelled` --
      # `main` included, with all four deciding legs green. The budget ends the run inside the cap
      # instead: the runner stops starting files, names what it never measured, and exits non-zero
      # like any other failing step, which `continue-on-error` then absorbs. It also keeps the
      # evidence the Windows units need, because a leg killed by the platform mid-file loses its
      # summary. 20 of the 25 minutes, leaving room for the install/lint/typecheck ahead of it and
      # the teardown behind it.
      - run: bun run test --timeout ${{ matrix.platform == 'win32' && 300000 || 60000 }}${{ matrix.platform == 'win32' && ' --budget 1200000' || '' }}
        if: env.CI_WIN32_FILTER_RUN != 'true'
      # Skipped on every leg when a win32_test_filter run only needs targeted test evidence: none of
      # e2e/build/package/binary add anything a targeted `bun test` run doesn't already show, and the
      # non-win32 legs never even installed bun above to run them.
      - run: bun run test:e2e
        if: env.CI_WIN32_FILTER_RUN != 'true'
      - run: bun run build
        if: env.CI_WIN32_FILTER_RUN != 'true'
      - run: bun run package:verify
        if: env.CI_WIN32_FILTER_RUN != 'true'
      # Ordinary CI proves the current host can produce a working executable; it never publishes one.
      - run: bun run binary:verify
        if: env.CI_WIN32_FILTER_RUN != 'true'
      - name: Verify the Linux executable archive
        if: matrix.platform == 'linux' && env.CI_WIN32_FILTER_RUN != 'true'
        run: bun scripts/__tests__/release-artifacts-native.scenario.ts dist/sea/wtm
